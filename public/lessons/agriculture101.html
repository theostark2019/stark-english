so grows corn.","The farm produces soybeans.","The team uses a tractor.","Farm workers check the crops.","Paulo works with a team.","Marina meets the farm manager.","The producer discusses coffee.","The technician checks plants.","A researcher studies crops.","Farmers monitor their fields.","Farmers manage resources.","Water is a farm resource.","The tractor transports supplies.","The producer focuses on quality.","Production requires planning.","Farmers use crop rotation.","Harvesting requires workers."],"readings":["My name is Marina. I am from Lavras, Brazil. I am an agronomy student, and I visit farms to learn about agriculture. Today, I am on a coffee farm. The farmer is Paulo. He grows coffee and works with a small team. The farm has fields, plants and good soil. Workers plant young coffee trees, check the leaves and harvest coffee when it is ready. Paulo also talks about corn and soybeans. Different farms grow different crops. I like learning about farming because I want to work with farmers. At the end of the visit, I say, “Thank you. Nice to meet you!”","Marina is visiting an agricultural training event in Minas Gerais. She studies agronomy and wants to understand how farms operate. Her first visit is to a coffee farm, where workers monitor the crop, care for the soil and harvest coffee during the appropriate season. The next farm produces soybeans and corn. Its team uses tractors to prepare fields and transport supplies. Marina notices that farmers may grow different crops, but they all need to plan their work, manage resources and communicate with other people. She introduces herself to each farm manager, explains her studies and asks what the team does during the growing season. The visits help her connect classroom vocabulary with real agricultural work.","At a regional agriculture workshop, Marina meets producers, technicians and researchers from different parts of Brazil. She explains that she is studying agronomy and is especially interested in crop production. During a conversation with a soybean grower, she discovers that his farm rotates soybeans and corn to organize production and manage the soil. Another participant works with coffee and focuses on crop quality and harvesting decisions. Although their operations are different, both professionals rely on careful observations and teamwork. Marina learns that a useful professional introduction is more than a name and job title: it can establish a shared topic, show genuine interest and lead to a productive question. She practices explaining her background clearly without pretending to have experience she does not yet possess.","Agricultural professionals often collaborate across fields that involve different production systems, technical priorities and business constraints. At a multidisciplinary field day, a concise introduction helps participants establish their expertise while identifying potential areas of cooperation. A crop consultant might focus on soil management and yield variability, whereas a coffee producer may emphasize harvest timing, quality standards and market requirements. Rather than listing credentials alone, effective speakers connect their professional background to the purpose of the conversation. For someone at an early career stage, that may mean identifying a research interest, acknowledging the limits of their experience and asking a well-targeted question. This approach builds credibility and creates opportunities for meaningful technical exchange."]}</script><script>window.__starkKey=((new URLSearchParams(location.search).get("attempt"))||"preview")+":ag101-";(function(){const d=JSON.parse(document.getElementById("lesson").textContent),$=id=>document.getElementById(id),names=["Reading","Vocabulary","Substitution","Word Families","First Production","Transfer","Feedback"];let page=0,card=0,stage=0,mode="A1";let ratings;try{ratings=JSON.parse(localStorage.getItem((window.__starkKey+"28"))||"null")}catch(e){}if(!Array.isArray(ratings)
